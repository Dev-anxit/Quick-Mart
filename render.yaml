{
  "services": [
    {
      "type": "web",
      "name": "quickmart-backend",
      "env": "node",
      "plan": "free",
      "buildCommand": "npm install && npm run build",
      "startCommand": "npm start",
      "envVars": [
        {
          "key": "NODE_ENV",
          "value": "production"
        },
        {
          "key": "DATABASE_URL",
          "sync": false
        },
        {
          "key": "JWT_SECRET",
          "sync": false
        },
        {
          "key": "FRONTEND_URL",
          "value": "https://quickmart.vercel.app",
          "sync": false
        },
        {
          "key": "RAZORPAY_KEY_ID",
          "sync": false
        },
        {
          "key": "RAZORPAY_KEY_SECRET",
          "sync": false
        }
      ]
    }
  ]
}
