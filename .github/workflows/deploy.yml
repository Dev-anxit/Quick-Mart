name: Deploy QuickMart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Build & Test ─────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── Backend ──────────────────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Build backend (TypeScript)
        working-directory: ./backend
        run: npm run build

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://quickmart-backend.onrender.com/api
          VITE_SOCKET_URL: https://quickmart-backend.onrender.com

  # ─── Deploy (only on push to main) ───────────────────────────────────────
  deploy:
    name: Deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Trigger Render backend deploy ─────────────────────────────────────
      - name: Deploy Backend to Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL" \
            -H "Accept: application/json" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Deploy triggered:', d.get('id','unknown'))"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      # ── Deploy Frontend to Vercel ─────────────────────────────────────────
      - name: Deploy Frontend to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: ./frontend
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Deployment Summary
        run: |
          echo "🚀 QuickMart Deployment Complete!"
          echo "Frontend: https://quick-mart-virid-phi.vercel.app"
          echo "Backend:  https://quickmart-backend.onrender.com"
