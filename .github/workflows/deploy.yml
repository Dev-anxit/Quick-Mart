name: Deploy QuickMart

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci

    - name: Build Backend
      working-directory: ./backend
      run: npm run build
      continue-on-error: true

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
      continue-on-error: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy Backend to Render
      run: |
        echo "Backend deployment is handled by Render's GitHub integration"
        echo "Push to main branch will trigger automatic deployment"
    
    - name: Deploy Frontend to Vercel
      run: |
        echo "Frontend deployment is handled by Vercel's GitHub integration"
        echo "Push to main branch will trigger automatic deployment"
    
    - name: Create Deployment Status
      run: |
        echo "✅ QuickMart Deployment Pipeline Complete"
        echo ""
        echo "Backend: https://quickmart-backend.onrender.com"
        echo "Frontend: https://quickmart.vercel.app"
